[package]
name = "pirulla-bot"
version = "3.0.0"
edition = "2024"
description = "Tracks the average length of the videos of the Pirulla YouTube channel and publishes it as a website."
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
env_logger = "0.11.11"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
mockito = "1.7.2"
tempfile = "3.27.0"
